name: "Basic Demo"
app_id: "demo-basic"
customer_id: "yeti"
version: "1.0.0"
description: "Simple counter with persistent state and a custom Rust greeting endpoint"
schemas:
  path: schemas/basic.graphql

resources:
  path: resources/*.rs
  route: /api

static:
  path: web
  route: /
  spa: true
  build:
    source: source
    command: npm run build